name: Build Desktop

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install uv
        run: pip install uv
      - name: Install backend deps
        run: uv sync --frozen --project backend --all-extras
      - name: Install deps
        run: npm ci
      - name: Build package
        run: npm run package:win

      - name: Upload full zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: slideforge-full-win-zip
          path: release/electron-full-zip-*/*.zip
