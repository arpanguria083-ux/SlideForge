appId: com.slideforge.ai
productName: SlideForge AI
copyright: Copyright © 2026 SlideForge
directories:
  output: release/electron
  buildResources: buildResources
files:
  - dist/**
  - '!dist/electron/**'
  - dist-electron/**
  - legal/**
extraResources:
  - from: backend/dist-package/SlideForge
    to: backend
  - from: backend/model-bundle-ready
    to: model-bundle
# Windows code signing is controlled via environment variables:
#   CSC_LINK          — file:///path/to/cert.pfx (or Base64-encoded in CI)
#   CSC_KEY_PASSWORD  — PFX file password
# Set these to enable Authenticode signing.
# Without them, builds will be unsigned (no SmartScreen trust).
win:
  target: nsis
mac:
  target: dmg
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SlideForge AI
  warningsAsErrors: false
  license: LICENSE
